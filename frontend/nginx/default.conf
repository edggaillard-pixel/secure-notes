# Reverse proxy TLS : sert la SPA et relaie /api vers Flask (même origine).

# Couche de rate limiting supplémentaire (défense en profondeur) devant
# Flask-Limiter : absorbe les rafales avant qu'elles n'atteignent Python.
limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
limit_req_status 429;

server_tokens off;   # ne pas divulguer la version de Nginx

# HTTP -> redirection permanente vers HTTPS
server {
    listen 8080;
    server_name _;
    return 301 https://$host:${HTTPS_PORT}$request_uri;
}

server {
    listen 8443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;

    # Profil « intermediate » de Mozilla : TLS 1.2+ et suites AEAD uniquement.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:TLS:10m;
    ssl_session_tickets off;

    # Taille max d'une requête (upload 10 Mo + enveloppe multipart).
    client_max_body_size 11m;
    client_body_timeout 15s;
    client_header_timeout 15s;

    root /usr/share/nginx/html;

    # --- API ---------------------------------------------------------------
    location /api/ {
        limit_req zone=api burst=40 nodelay;
        # Flask pose lui-même CSP/nosniff/X-Frame-Options sur l'API ;
        # Nginx ajoute HSTS (c'est lui qui termine TLS).
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # $remote_addr et non $proxy_add_x_forwarded_for : on ÉCRASE l'en-tête
        # envoyé par le client. Sinon un attaquant pourrait forger
        # « X-Forwarded-For: 1.2.3.4 » et contourner le rate limiting par IP.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 30s;
    }

    location /api/auth/ {
        limit_req zone=auth burst=5 nodelay;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }

    # --- Assets versionnés (nom contenant un hash) : cache long ------------
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # --- SPA ---------------------------------------------------------------
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }

    # Aucun fichier caché (.git, .env...) ne doit jamais être servi.
    location ~ /\. {
        deny all;
        return 404;
    }
}
# GROGNON
