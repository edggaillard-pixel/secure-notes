# En-têtes de sécurité de la SPA.
# ATTENTION piège Nginx : un add_header dans un bloc location ANNULE tous ceux
# hérités du bloc server. D'où ce fichier inclus dans chaque location.

# CSP stricte : uniquement des ressources de la même origine, aucun script
# inline, aucun eval, aucun plugin. Même si un XSS injectait du HTML,
# le navigateur refuserait d'exécuter le script.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;

# HSTS : le navigateur refusera tout accès HTTP pendant 2 ans.
# (Ajouter "; preload" seulement sur un vrai domaine inscrit sur hstspreload.org.)
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
# GROGNON
